<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CoreBank — your accounts, payments, and branch operations in one clear workspace."
    />
    <meta name="theme-color" content="#020617" />
    <script>
      // Apply before first paint so a saved theme never flashes the other palette.
      (() => {
        let saved;
        try {
          saved = localStorage.getItem("core-banking-theme");
        } catch {}
        const dark =
          saved === "dark" ||
          (saved !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
    <title>CoreBank | Banking Workspace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
